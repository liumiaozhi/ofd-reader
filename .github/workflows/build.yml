name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # 打 tag 时需要把 exe 附加到 Release

jobs:
  build:
    name: 打包与校验
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller==6.17.0"
          python -c "import sys, docx, lxml.etree, PIL; print('Python', sys.version.split()[0]); print('python-docx', docx.__version__); print('lxml', lxml.etree.__version__); print('Pillow', PIL.__version__)"

      - name: 语法门禁（必须兼容 3.8）
        run: python -m py_compile ofd2docx.py ofd_view.py ofd_reader.py tools/make_sample.py tools/capture_screenshots.py

      - name: 核心自测（36 项断言，现场合成样本）
        run: python ofd2docx.py --self-test

      - name: 生成演示样本
        run: python tools/make_sample.py out/sample.ofd

      - name: 打包 exe
        run: python -m PyInstaller ofd_reader.spec --noconfirm --clean

      - name: 冻结后自检（解析 / 渲染 / 导出）
        run: |
          .\dist\ofd阅读转换器.exe --version
          .\dist\ofd阅读转换器.exe --selftest out\sample.ofd --report out\selftest.txt
          Get-Content out\selftest.txt -Encoding UTF8

      - name: 冻结后界面冒烟（多标签 / 拆窗 / 滚轮）
        run: |
          .\dist\ofd阅读转换器.exe --smoke-gui out\sample.ofd --report out\smoke.txt
          Get-Content out\smoke.txt -Encoding UTF8

      - name: 汇总报告
        if: always()
        run: |
          if (Test-Path out\selftest.txt) { Write-Host "===== selftest ====="; Get-Content out\selftest.txt -Encoding UTF8 }
          if (Test-Path out\smoke.txt) { Write-Host "===== smoke ====="; Get-Content out\smoke.txt -Encoding UTF8 }

      - name: 归档产物
        uses: actions/upload-artifact@v4
        with:
          name: ofd-reader-win64
          path: |
            dist/ofd阅读转换器.exe
            out/selftest.txt
            out/smoke.txt
          if-no-files-found: error
          retention-days: 30

      - name: 为 Release 准备 ASCII 文件名
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Copy-Item "dist\ofd阅读转换器.exe" "dist\ofd-reader-${{ github.ref_name }}.exe"
          Get-ChildItem dist\*.exe | Select-Object Name, Length

      - name: 附加 exe 到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ofd-reader-*.exe
          generate_release_notes: true
